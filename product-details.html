<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            display: flex;
            flex-direction: column;
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            color: var(--text-main);
            padding: 0 20px 60px;
        }

        header.navbar {
            position: sticky; top: 15px;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 14px 28px;
            display: flex; justify-content: space-between; align-items: center;
            margin: 15px auto 40px; z-index: 1000; width: 100%; max-width: 1100px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand { font-size: 22px; font-weight: 800; color: white; text-decoration: none; letter-spacing: -0.5px; }
        .nav-btn { background: rgba(255,255,255,0.08); color: white; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid var(--glass-border); }
        .nav-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }

        /* Main Details Wrapper */
        .details-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 48px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            align-items: start;
        }

        /* Fixed Square Image Box */
        .image-box {
            background: #ffffff;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            display: flex; justify-content: center; align-items: center;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        .image-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            border-radius: 8px;
            transition: transform 0.4s ease;
        }
        
        .image-box:hover img { transform: scale(1.05); }

        /* Information Column */
        .info-box { display: flex; flex-direction: column; justify-content: flex-start; }
        .category { font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 32px; font-weight: 800; margin: 0 0 16px 0; letter-spacing: -0.8px; line-height: 1.25; }
        .price { font-size: 32px; font-weight: 800; color: var(--accent); margin-bottom: 24px; }
        
        .description-wrapper {
            background: rgba(3, 7, 18, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 32px;
        }
        
        .description { line-height: 1.7; color: var(--text-dim); font-size: 15px; margin: 0; white-space: pre-wrap; }

        .order-btn {
            background: var(--accent); color: #052e16;
            padding: 16px 36px; border-radius: 14px;
            text-decoration: none; font-weight: 800; font-size: 16px;
            text-align: center; border: none; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: fit-content;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
        }
        .order-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5); }

        /* Error state styling */
        .error-message { text-align: center; grid-column: span 2; padding: 60px 0; }

        /* Responsive Layouts */
        @media (max-width: 900px) {
            .details-container { grid-template-columns: 1fr; gap: 30px; padding: 24px; }
            .image-box { max-width: 450px; margin: 0 auto; }
            .title { font-size: 26px; }
            .order-btn { width: 100%; }
        }

        .global-theme-toggle {
            background: var(--card-bg, rgba(17, 24, 39, 0.7));
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            color: var(--text-main, #fff);
            cursor: pointer;
            padding: 10px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .global-theme-toggle:hover { transform: scale(1.05); }
        .theme-icon-slot { font-size: 16px; line-height: 1; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="home.html" class="brand">
            <span>ShopSphere</span>
        </a>
        <button class="global-theme-toggle" id="theme-switch-btn" onclick="toggleGlobalTheme()" title="Switch Theme">
            <span class="theme-icon-slot">🌙</span>
        </button>
        <nav style="display: flex; gap: 10px;">
            <a class="nav-btn" href="products.html">← Back to Shop</a>
            <a class="nav-btn" href="cart.html" style="background: white; color: black; position: relative; display: flex; align-items: center; font-weight: 700;">
                🛒 Cart <span id="cart-badge" style="position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; font-size: 11px; font-weight: 800; width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid var(--bg);">0</span>
            </a>
        </nav>
    </header>

    <div class="details-container" id="details-box">
        <div class="error-message">
            <h2>Loading product details...</h2>
        </div>
    </div>

    <script src="theme-manager.js"></script>
    <script src="shop-bot.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const container = document.getElementById('details-box');

        if (!productId) {
            container.innerHTML = `<div class="error-message"><h2>Product not found.</h2><a href="products.html" class="nav-btn">Return to Shop</a></div>`;
            return;
        }

        updateDetailsCartBadge();

        fetch(`https://shopsphere-backend-wr5o.onrender.com/products/${productId}`)
            .then(res => {
                if (!res.ok) throw new Error("Item fetch failed");
                return res.json();
            })
            .then(product => {
                container.innerHTML = `
                    <div class="image-box">
                        <img src="${product.image || 'https://via.placeholder.com/400'}" alt="${product.name}">
                    </div>
                    <div class="info-box">
                        <span class="category">${product.category || 'Premium Listing'}</span>
                        <h1 class="title">${product.name}</h1>
                        <div class="price">Kshs ${product.price ? product.price.toLocaleString() : '0'}</div>
                        <div class="description-wrapper">
                            <p class="description">${product.description || 'No additional specifications listed for this product.'}</p>
                        </div>
                        <button class="order-btn" id="add-to-cart-btn">
                            <span>Add to Cart</span>
                            <span>🛒</span>
                        </button>
                    </div>
                `;

                document.getElementById('add-to-cart-btn').onclick = () => {
                    let cart = JSON.parse(localStorage.getItem("cart")) || [];
                    const existing = cart.find(item => item.name === product.name);

                    if (existing) {
                        existing.qty++;
                    } else {
                        cart.push({
                            name: product.name,
                            price: Number(product.price) || 0,
                            qty: 1
                        });
                    }

                    localStorage.setItem("cart", JSON.stringify(cart));
                    updateDetailsCartBadge();
                    alert(`✅ "${product.name}" has been successfully added to your cart!`);
                };
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = `<div class="error-message"><h2>Failed to load item details.</h2><p>Please check your connection or try again later.</p></div>`;
            });
    });

    function updateDetailsCartBadge() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const badge = document.getElementById("cart-badge");
        if (!badge) return;

        const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
        badge.innerText = totalItems;
        
        if (totalItems > 0) {
            badge.style.display = "flex";
        } else {
            badge.style.display = "none";
        }
    }
    </script>
</body>
</html>
