<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 0% 100%, #1e1b4b, #030712);
            color: var(--text-main);
            padding: 0 20px 60px;
        }

        header.navbar {
            position: sticky; top: 10px;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 25px;
            display: flex; justify-content: space-between; align-items: center;
            margin: 10px auto 40px; z-index: 1000; max-width: 1000px;
        }

        .brand { font-size: 20px; font-weight: 800; color: white; text-decoration: none; }
        .nav-btn { background: rgba(255,255,255,0.1); color: white; padding: 8px 18px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid var(--glass-border); }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }

        .details-container {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 28px;
        }

        .image-box {
            background: rgba(3, 7, 18, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            display: flex; justify-content: center; align-items: center;
            aspect-ratio: 1;
        }

        .image-box img { max-width: 100%; max-height: 400px; object-fit: contain; border-radius: 12px; }

        .info-box { display: flex; flex-direction: column; justify-content: center; }
        .category { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 1.5px; margin-bottom: 8px; }
        .title { font-size: 36px; font-weight: 800; margin: 0 0 15px 0; letter-spacing: -1px; }
        .price { font-size: 28px; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
        .description { line-height: 1.6; color: var(--text-dim); font-size: 16px; margin-bottom: 30px; }

        .order-btn {
            background: var(--accent); color: #000;
            padding: 16px 32px; border-radius: 16px;
            text-decoration: none; font-weight: 800; font-size: 16px;
            text-align: center; border: none; cursor: pointer;
            display: inline-block; width: fit-content;
        }
        .order-btn:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }

        /* Error state styling */
        .error-message { text-align: center; grid-column: span 2; padding: 40px 0; }

        @media (max-width: 768px) {
            .details-container { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
            .title { font-size: 28px; }
            .order-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="home.html" class="brand">ShopSphere</a>
        <a class="nav-btn" href="products.html">← Back to Shop</a>
    </header>

    <div class="details-container" id="details-box">
        <div class="error-message">
            <h2>Loading product details...</h2>
        </div>
    </div>

    <script>
       document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    const container = document.getElementById('details-box');

    if (!productId) {
        container.innerHTML = `<div class="error-message"><h2>Product not found.</h2><a href="products.html" class="nav-btn">Return to Shop</a></div>`;
        return;
    }

    // Fetch the target item data directly from your live API endpoint
    fetch(`https://shopsphere-backend-wr5o.onrender.com/products/${productId}`)
        .then(res => {
            if (!res.ok) throw new Error("Item fetch failed");
            return res.json();
        })
        .then(product => {
            // Inject structural layout dynamically with an updated Add to Cart button
            container.innerHTML = `
                <div class="image-box">
                    <img src="${product.image || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'300\'><rect width=\'100%\' height=\'100%\' fill=\'%23111827\'/></svg>'}" alt="${product.name}">
                </div>
                <div class="info-box">
                    <span class="category">${product.category || 'Premium Listing'}</span>
                    <h1 class="title">${product.name}</h1>
                    <div class="price">KES ${product.price ? product.price.toLocaleString() : 'N/A'}</div>
                    <p class="description">${product.description || 'No description available for this product item.'}</p>
                    <button class="order-btn" id="add-to-cart-btn">Add to Cart 🛒</button>
                </div>
            `;

            // Handle adding items to your persistent cart structure
            document.getElementById('add-to-cart-btn').onclick = () => {
                // 1. Pull current storage list matching cart.js scheme
                let cart = JSON.parse(localStorage.getItem("cart")) || [];

                // 2. Check if the product already exists in the cart array
                const existingItem = cart.find(item => item.name === product.name);

                if (existingItem) {
                    existingItem.qty += 1; // Increment matching your 'qty' property rule
                } else {
                    cart.push({
                        name: product.name,
                        price: product.price,
                        qty: 1 // Match the property schema expected by cart.js
                    });
                }

                // 3. Save changes back to local storage
                localStorage.setItem("cart", JSON.stringify(cart));

                // 4. Send the user to your functional checkout page
                window.location.href = "cart.html"; // Adjust file name path if yours is named checkout.html
            };
        })
        .catch(err => {
            console.error(err);
            container.innerHTML = `<div class="error-message"><h2>Failed to load item details.</h2><p>Please check your connection or try again later.</p></div>`;
        });
});
    </script>
</body>
</html>
