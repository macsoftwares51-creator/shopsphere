<script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderCart() {
        const list = document.getElementById("cart-items-list");
        const summary = document.getElementById("cart-summary");
        const empty = document.getElementById("empty-state");
        
        // Breakdown Displays
        const subtotalDisplay = document.getElementById("subtotal-display");
        const deliveryDisplay = document.getElementById("delivery-display");
        const deliveryNote = document.getElementById("delivery-note");
        const totalDisplay = document.getElementById("total-display");

        list.innerHTML = "";
        let subtotal = 0;

        if (cart.length === 0) {
            summary.style.display = "none";
            empty.style.display = "block";
            return;
        }

        summary.style.display = "block";
        empty.style.display = "none";

        cart.forEach((item, index) => {
            subtotal += item.price * item.qty;
            const itemEl = document.createElement("div");
            itemEl.className = "cart-item";
            itemEl.innerHTML = `
                <div class="item-info">
                    <b>${item.name}</b>
                    <span>Kes ${item.price.toLocaleString()} per unit</span>
                </div>
                <div class="controls">
                    <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                    <span style="font-weight:bold; min-width: 20px; text-align:center">${item.qty}</span>
                    <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                    <button class="remove-btn" onclick="removeItem(${index})">✕</button>
                </div>
            `;
            list.appendChild(itemEl);
        });

        // --- DELIVERY FEE LOGIC ---
        let deliveryFee = 0;
        let note = "";

        if (subtotal < 1000) {
            deliveryFee = 200;
            note = "Delivery is Kes 200 for orders below Kes 1,000.";
        } else if (subtotal >= 1000 && subtotal < 2000) {
            deliveryFee = 100;
            note = "Delivery is Kes 100 for orders between Kes 1,000 and Kes 2,000.";
        } else {
            deliveryFee = 0;
            note = "Congrats! You've unlocked FREE delivery (Orders above Kes 2,000).";
        }

        const grandTotal = subtotal + deliveryFee;

        // Update UI
        subtotalDisplay.innerText = "Kes " + subtotal.toLocaleString();
        deliveryDisplay.innerText = deliveryFee === 0 ? "FREE" : "Kes " + deliveryFee.toLocaleString();
        deliveryNote.innerText = note;
        totalDisplay.innerText = "Total: Kes " + grandTotal.toLocaleString();
    }

    function changeQty(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) cart.splice(index, 1);
        updateAndSave();
    }

    function removeItem(index) {
        cart.splice(index, 1);
        updateAndSave();
    }

    function clearCart() {
        if (!confirm("Remove all items?")) return;
        cart = [];
        updateAndSave();
    }

    function updateAndSave() {
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
    }

    function placeOrder() {
        const name = document.getElementById("customerName").value.trim();
        if (!name) return alert("Please enter your name for delivery");
        if (cart.length === 0) return;

        // Recalculate for WhatsApp message
        const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        let deliveryFee = subtotal < 1000 ? 200 : (subtotal < 2000 ? 100 : 0);
        const total = subtotal + deliveryFee;

        let message = `Hello ShopSphere!%0A%0A`;
        message += `*Order for:* ${name}%0A`;
        message += `*Items:*%0A`;

        cart.forEach(item => {
            message += `• ${item.name} (x${item.qty}) - Kes ${item.price * item.qty}%0A`;
        });

        message += `%0A--------------------------%0A`;
        message += `Subtotal: Kes ${subtotal.toLocaleString()}%0A`;
        message += `Delivery Fee: ${deliveryFee === 0 ? "FREE" : "Kes " + deliveryFee}%0A`;
        message += `*Grand Total: Kes ${total.toLocaleString()}*%0A`;
        message += `--------------------------%0A%0A`;
        message += `_I understand the 9% upfront and 91% on delivery terms._`;

        const phone = "254111803422";
        window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
    }

    renderCart();
</script>
