<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Review Moderation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { margin: 0; color: #22c55e; }
        
        .review-table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(255,255,255,0.05); color: #9ca3af; font-size: 12px; text-transform: uppercase; }
        
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .pending { background: #fbbf24; color: #000; }
        .live { background: #22c55e; color: #000; }

        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-approve { background: #22c55e; color: black; }
        .btn-delete { background: #ef4444; color: white; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Review Moderation</h1>
        <a href="add-product.html" style="color: white; text-decoration: none;">← Dashboard</a>
    </div>

    <table class="review-table">
        <thead>
            <tr>
                <th>Customer</th>
                <th>Comment</th>
                <th>Rating</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="adminReviewList">
            </tbody>
    </table>

   <script>
    const API = "https://shopsphere-backend-wr5o.onrender.com";

    async function loadAdminReviews() {
        try {
            const res = await fetch(`${API}/Review/admin/all`);
            if (!res.ok) throw new Error("Failed to load");
            
            const reviews = await res.json();
            const list = document.getElementById("adminReviewList");
            list.innerHTML = "";

            if(reviews.length === 0) {
                list.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No reviews found.</td></tr>";
                return;
            }

            reviews.forEach(r => {
                list.innerHTML += `
                    <tr>
                        <td><strong>${r.name}</strong></td>
                        <td>${r.comment}</td>
                        <td>${"⭐".repeat(r.rating)}</td>
                        <td>
                            <span class="status-badge ${r.approved ? 'live' : 'pending'}">
                                ${r.approved ? 'LIVE' : 'PENDING'}
                            </span>
                        </td>
                        <td>
                            ${!r.approved ? `<button class="btn btn-approve" onclick="approveReview('${r._id}')">Approve</button>` : ''}
                            <button class="btn btn-delete" onclick="deleteReview('${r._id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Load Error:", err);
        }
    }

    async function approveReview(id) {
        if(!confirm("Push this review live?")) return;

        try {
            const res = await fetch(`${API}/Review/approve/${id}`, { 
                method: "PATCH",
                headers: { "Content-Type": "application/json" }
            });

            const data = await res.json();

            if (data.success) {
                alert("✅ Review is now visible on the frontend!");
                loadAdminReviews(); // Refresh the table
            } else {
                alert("❌ Approval failed. Check server logs.");
            }
        } catch (err) {
            alert("⚠️ Connection error. Make sure your Backend is redeployed with PATCH allowed.");
        }
    }

    async function deleteReview(id) {
        if(!confirm("Delete this review forever?")) return;
        
        try {
            const res = await fetch(`${API}/Review/${id}`, { method: "DELETE" });
            if(res.ok) loadAdminReviews();
        } catch (err) {
            alert("Delete failed.");
        }
    }

    loadAdminReviews();
</script>
</body>
</html>
