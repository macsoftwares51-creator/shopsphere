<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | ShopSphere Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card-bg: #0f172a;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container { max-width: 1100px; margin: auto; }

        h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 40px; text-align: left; }
        h1 span { color: var(--success); }

        /* Admin Navigation Grid */
        .admin-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 50px;
        }

        .nav-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-card:hover {
            border-color: var(--accent);
            background: #1e293b;
            transform: translateY(-5px);
        }

        .nav-card b { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
        .nav-card span { font-size: 18px; font-weight: 700; }

        /* Main Content Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        /* Form Styling */
        .form-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .form-section h2 { font-size: 20px; margin-top: 0; margin-bottom: 20px; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1e293b;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        .add-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-btn:hover { background: #2563eb; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        /* Product Inventory Grid */
        .inventory-section h2 { font-size: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .card h3 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card p { color: var(--text-dim); font-size: 14px; margin: 5px 0 15px; }
        .card .price { color: var(--success); font-weight: 800; font-size: 16px; }

        .delete-btn {
            width: 100%;
            padding: 8px;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .delete-btn:hover { background: var(--danger); color: white; }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .form-section { position: relative; }
        }
        /* DETAIL UPDATE PANEL POPUP OVERLAY MODAL */
        .info-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; visibility: hidden;
        }
        .info-modal.active { opacity: 1; visibility: visible; }
        .modal-body {
            background: #0f172a; border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 24px; width: 100%; max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .modal-body h2 { font-size: 20px; margin: 0 0 15px 0; font-weight: 800; }
        .modal-body textarea {
            width: 100%; height: 140px; padding: 12px; background: #1e293b;
            border: 1px solid var(--glass-border); border-radius: 12px;
            color: white; font-family: inherit; resize: none; outline: none; margin-bottom: 15px;
        }
        .modal-body textarea:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; }
        .save-spec-btn { background: var(--accent); color: white; }
        .cancel-spec-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--glass-border); }
        
        /* CARD BUTTON ADAPTATIONS */
        .card-controls { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .info-btn {
            width: 100%; padding: 8px; background: rgba(59, 130, 246, 0.1);
            color: var(--accent); border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .info-btn:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Command <span>Center</span></h1>

    <div class="admin-nav">
        <a href="products.html" class="nav-card">
            <b>Live Site</b>
            <span>Public Store</span>
        </a>
        <a href="admin-requests.html" class="nav-card">
            <b>Orders</b>
            <span>Incoming Requests</span>
        </a>
        <a href="adminsellers.html" class="nav-card" style="border-color: var(--success);">
            <b>Inventory</b>
            <span>Seller Approvals</span>
        </a>
        <a href="admin-review.html" class="nav-card" style="border-color: #fbbf24;">
            <b>Feedback</b>
            <span>Review Moderation</span>
        </a>
        <a href="Delivery.html" class="nav-card" style="border-color: #fbbf24;">
            <b>POD</b>
            <span>PROOF OF DELIVERY</span>
        </a>
    </div>

    <div class="dashboard-grid">
        <div class="form-section">
            <h2>Add New Product</h2>
            <form id="form">
                <input name="name" placeholder="Product Name" required />
                <input name="price" placeholder="Price (KES)" type="number" required />
                <input name="category" placeholder="Category (e.g. Phones)" required />
                <label style="font-size: 12px; color: var(--text-dim); margin-bottom: 5px; display: block;">Product Image</label>
                <input name="image" type="file" accept="image/*" required />
                <button class="add-btn">Publish to Store</button>
            </form>
        </div>

        <div class="inventory-section">
            <h2>Live Inventory <span id="count" style="color: var(--accent);">0</span></h2>
            <div class="products-grid" id="products">
                </div>
        </div>
    </div>
</div>
 <div class="info-modal" id="specModal">
    <div class="modal-body">
        <h2 id="modalTitle">Add Product Specifications</h2>
        <textarea id="specTextTextarea" placeholder="Enter sizing chart rules, item technical specifications, or secondary promotional descriptors..."></textarea>
        <div class="modal-actions">
            <button class="modal-btn cancel-spec-btn" onclick="closeSpecModal()">Discard</button>
            <button class="modal-btn save-spec-btn" id="modalSaveBtn">Save Information</button>
        </div>
    </div>
</div>
<script src = "add-product.js">

</script>
   
</body>
</html>
