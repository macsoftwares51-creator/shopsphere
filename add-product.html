<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - ShopSphere</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    form input, form button { display: block; margin: 10px 0; padding: 8px; width: 100%; }
    .products { margin-top: 30px; }
    .product { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    .product img { max-width: 100px; display: block; margin-top: 5px; }
  </style>
</head>
<body>

<h2>Add Product</h2>
<form id="form" enctype="multipart/form-data">
  <input name="name" placeholder="Product name" required />
  <input name="price" placeholder="Price" type="number" required />
  <input name="category" placeholder="Category" required />
  <input name="image" type="file" accept="image/*" required />
  <button type="submit">Add Product</button>
</form>

<div class="products" id="products"></div>

<script>
const form = document.getElementById("form");
const productsDiv = document.getElementById("products");

// Submit form
form.onsubmit = async e => {
  e.preventDefault();
  const formData = new FormData(form);

  try {
    const res = await fetch("https://shopsphere-61ww.onrender.com/add-product", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    if (res.ok) {
      alert(data.message);
      form.reset();
      fetchProducts(); // Refresh product list
    } else {
      alert("Error: " + data.message);
    }
  } catch (err) {
    alert("Network error: " + err.message);
  }
};

// Fetch and display products
async function fetchProducts() {
  try {
    const res = await fetch("https://shopsphere-61ww.onrender.com/product");
    const products = await res.json();

    productsDiv.innerHTML = "";
    products.forEach(p => {
      const div = document.createElement("div");
      div.className = "product";
      div.innerHTML = `
        <strong>${p.name}</strong><br>
        Price: $${p.price}<br>
        Category: ${p.category}<br>
        <img src="https://shopsphere-61ww.onrender.com${p.image}" alt="${p.name}">
      `;
      productsDiv.appendChild(div);
    });
  } catch (err) {
    console.error("Failed to fetch products", err);
  }
}

// Load products on page load
fetchProducts();
</script>

</body>
</html>
