<h1>Customer Marketplace</h1>

<div class="filters">
  <input id="search" placeholder="Search products...">
  <select id="category">
    <option value="">All Categories</option>
  </select>
</div>

<div id="products"></div>

<div id="imageModal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
  <img id="modalImg" style="max-width:90%; max-height:90%; border-radius: 8px;">
</div>

<script>
let allProducts = [];

// 1. FETCH DATA: Updated to ensure we handle the 404/HTML error safely
fetch("https://shopsphere-backend-wr5o.onrender.com/SellerRequest/approved")
  .then(res => {
    // If the server sends a 404, this stops it from trying to parse HTML as JSON
    if (!res.ok) throw new Error("Could not find the approved products list.");
    return res.json();
  })
  .then(data => {
    console.log("Loaded approved products:", data);
    allProducts = data;
    fillCategories(data);
    render(data);
  })
  .catch(error => {
    console.error("Error loading products:", error);
    document.getElementById("products").innerHTML = "<p>Unable to load products. Please check the API endpoint.</p>";
  });

// 2. RENDER FUNCTION: Builds the product cards
function render(products) {
  const box = document.getElementById("products");
  if (!box) return; 
  
  box.innerHTML = "";

  products.forEach(p => {
    const name = p.name || "Unnamed Product";
    const category = p.category || "General";
    const price = Number(p.price) || 0;
    const image = p.image || "https://via.placeholder.com/200";
    const cancelledPrice = Math.round((price * 1.3) / 10) * 10;

    box.innerHTML += `
      <div class="card" style="border: 1px solid #ddd; padding: 10px; margin: 10px; display: inline-block; width: 200px; vertical-align: top;">
        <img src="${image}" onclick="openImage('${image}')" style="width:100%; cursor:pointer; height: 150px; object-fit: cover;" />
        <h3>${name}</h3>
        <p><em>${category}</em></p>
        <div style="text-decoration: line-through; color: gray;">Kshs ${cancelledPrice}</div>
        <div style="font-weight: bold; color: green;">Kshs ${price}</div>
        <button onclick="addToCart('${name.replace(/'/g, "\\'")}', ${price})" style="margin-top: 10px; cursor: pointer;">
          Add to Cart
        </button>
      </div>
    `;
  });
}

// 3. UTILITY FUNCTIONS
function fillCategories(products) {
  const select = document.getElementById("category");
  const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    select.appendChild(opt);
  });
}

function openImage(src) {
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImg");
  modalImg.src = src;
  modal.style.display = "flex";
}

// Close modal when clicked
document.getElementById("imageModal").onclick = function() {
  this.style.display = "none";
};

// Filter logic
document.getElementById("search").oninput = 
document.getElementById("category").onchange = () => {
  const q = document.getElementById("search").value.toLowerCase();
  const cat = document.getElementById("category").value;

  render(allProducts.filter(p =>
    (p.name || "").toLowerCase().includes(q) &&
    (!cat || p.category === cat)
  ));
};

function addToCart(name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const existing = cart.find(item => item.name === name);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ name, price, qty: 1 });
  }
  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added to cart");
}
</script>
