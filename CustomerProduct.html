<h1>Customer Marketplace</h1>

<input id="search" placeholder="Search products..." oninput="filterProducts()">

<div id="productList"></div>

<script>

function addToCart(name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const existing = cart.find(item => item.name === name);

  if (existing) {
    existing.qty++;
  } else {
    cart.push({ name, price, qty: 1 });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added to cart");
}

let allProducts = [];

fetch("https://shopsphere-backend-wr5o.onrender.com/SellerRequest/approved")
  .then(res => res.json())
  .then(data => {
    console.log("sellerrequests:", data);
    allProducts = data;
    fillCategories(data);
    render(data);
  })
  .catch(error => console.error("Error loading products:", error));

function fillCategories(products) {
  const select = document.getElementById("category");
  const categories = [...new Set(products.map(p => p.category).filter(Boolean))];

  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    select.appendChild(opt);
  });
}
function openImage(src){
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImg");

  modalImg.src = src;
  modal.style.display = "flex";
}

document.getElementById("imageModal").onclick = function(){
  this.style.display = "none";
};
function render(products) {
  const box = document.getElementById("products");
  box.innerHTML = "";

  products.forEach(p => {

    const name = p.name || "No Name";
    const category = p.category || "No Category";
    const price = Number(p.price) || 0;
    const image = p.image || "https://via.placeholder.com/200";

    const cancelledPrice = Math.round((price * 1.3) / 10) * 10;

    box.innerHTML += `
      <div class="card">
        <img src="${image}" onclick="openImage('${image}')" style="cursor:pointer;" />
        <h3>${name}</h3>
        <p>${category}</p>

        <div class="old-price">Kshs ${cancelledPrice}</div>
        <div class="price">Kshs ${price}</div>

        <button onclick="addToCart('${name}', ${price})">
          Add to Cart
        </button>
      </div>
    `;
  });
}

document.getElementById("search").oninput =
document.getElementById("category").onchange = () => {
  const q = search.value.toLowerCase();
  const cat = category.value;

  render(allProducts.filter(p =>
    (p.name || "").toLowerCase().includes(q) &&
    (!cat || p.category === cat)
  ));
};

</script>
