<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Official Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e293b, #030712);
            color: var(--text-main);
            padding: 0 20px 40px;
        }

        /* Modern Header */
        header.navbar {
            position: sticky; top: 10px;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 25px;
            display: flex; justify-content: space-between; align-items: center;
            margin: 10px auto 30px; z-index: 1000; max-width: 1200px;
        }

        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
        .brand img { height: 45px; border-radius: 8px; }
        .brand span { font-size: 20px; font-weight: 800; letter-spacing: -1px; }

        .nav-btn {
            background: var(--accent); color: #000;
            padding: 8px 18px; border-radius: 12px;
            text-decoration: none; font-weight: 700; font-size: 14px;
        }

        /* Filter Section */
        .controls {
            max-width: 1200px; margin: 0 auto 30px;
            display: flex; gap: 15px; flex-wrap: wrap;
        }

        input, select, textarea {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            color: white; padding: 12px 16px;
            border-radius: 14px; font-family: inherit; outline: none;
        }

        input:focus { border-color: var(--accent); }

        /* Bento-style Request Section */
        .request-section {
            max-width: 1200px; margin: 0 auto 50px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(17, 24, 39, 0.7));
            padding: 30px; border-radius: 32px;
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center;
        }

        .request-form { display: flex; flex-direction: column; gap: 10px; }
        .request-section h2 { margin: 0; font-size: 28px; font-weight: 800; }

        .btn-gold { 
            background: #fbbf24; color: #000; border: none; 
            padding: 14px; border-radius: 12px; font-weight: 800; 
            cursor: pointer; font-size: 16px;
        }

        /* Product Grid */
        .grid {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 28px;
            opacity: 0; /* For reveal */
        }

        .reveal { animation: fadeInUp 0.6s forwards; }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .card img {
            width: 100%; height: 200px;
            object-fit: cover; border-radius: 20px;
            margin-bottom: 15px;
        }

        .card h3 { margin: 10px 0 5px; font-size: 18px; font-weight: 700; }
        .card p { color: var(--text-dim); font-size: 14px; margin-bottom: 15px; }

        .price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px; }
        .price { color: var(--accent); font-size: 20px; font-weight: 800; }
        .old-price { text-decoration: line-through; color: #6b7280; font-size: 14px; }

        .add-btn {
            background: var(--accent); color: #000; border: none;
            width: 100%; padding: 12px; border-radius: 14px;
            font-weight: 800; cursor: pointer;
        }

        /* Image Modal */
        #imageModal {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:2000;
        }

        @media (max-width: 768px) {
            .request-section { grid-template-columns: 1fr; }
            header.navbar { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<div id="imageModal" onclick="this.style.display='none'">
    <img id="modalImg" style="max-width:90%; max-height:90%; border-radius:15px;" />
</div>

<header class="navbar">
    <a href="home.html" class="brand">
        <img src="logo3.1.png" alt="ShopSphere">
        <span>ShopSphere</span>
    </a>
    <nav style="display: flex; gap: 10px;">
        <a class="nav-btn" href="home.html">Home</a>
        <a class="nav-btn" href="cart.html" style="background: white;">🛒 Cart</a>
    </nav>
</header>

<section class="request-section">
    <div>
        <h2>Missing something?</h2>
        <p>Tell us what you're looking for and we'll source it for you at the best price.</p>
        <p style="font-size: 12px; color: var(--accent);">⚡ Server wake-up: 10-30s</p>
    </div>
    <div class="request-form">
        <input id="reqName" placeholder="Your Name">
        <input id="reqEmail" placeholder="Your Email">
        <textarea id="reqProduct" placeholder="Describe the item (size, color, brand)..."></textarea>
        <button class="btn-gold" onclick="sendRequest()">Send Request</button>
        <p id="reqMessage" style="font-size: 14px; text-align: center;"></p>
    </div>
</section>

<div class="controls">
    <input id="search" placeholder="🔍 Search products..." style="flex: 2;">
    <select id="category" style="flex: 1;">
        <option value="">All Categories</option>
    </select>
</div>

<div class="grid" id="products"></div>

<script>
// --- API LOGIC ---
let allProducts = [];

fetch("https://shopsphere-backend-wr5o.onrender.com/products")
  .then(res => res.json())
  .then(data => {
    allProducts = data;
    fillCategories(data);
    render(data);
  })
  .catch(err => console.error("Error:", err));

function render(products) {
    const box = document.getElementById("products");
    box.innerHTML = "";
    
    products.forEach((p, index) => {
        const name = p.name || "Unnamed";
        const category = p.category || "General";
        const price = Number(p.price) || 0;
        const image = p.image || "https://via.placeholder.com/200";
        // Removed strike-through price calculation as requested earlier
        
        const card = document.createElement('div');
        card.className = 'card';
        // Add reveal class with stagger
        setTimeout(() => card.classList.add('reveal'), index * 50);

        card.innerHTML = `
            <img src="${image}" onclick="openImage('${image}')" style="cursor:zoom-in;">
            <h3>${name}</h3>
            <p>${category}</p>
            <div class="price-row">
                <span class="price">Kshs ${price}</span>
            </div>
            <button class="add-btn" onclick="addToCart('${name.replace(/'/g, "\\'")}', ${price})">
                Add to Cart
            </button>
        `;
        box.appendChild(card);
    });
}

// --- UTILITIES ---
function fillCategories(products) {
    const select = document.getElementById("category");
    const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
    categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
    });
}

function openImage(src) {
    document.getElementById("modalImg").src = src;
    document.getElementById("imageModal").style.display = "flex";
}

function addToCart(name, price) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    const existing = cart.find(item => item.name === name);
    if (existing) { existing.qty++; } 
    else { cart.push({ name, price, qty: 1 }); }
    localStorage.setItem("cart", JSON.stringify(cart));
    alert(name + " added to cart!");
}

async function sendRequest() {
    const btn = document.querySelector(".btn-gold");
    const name = document.getElementById("reqName").value;
    const email = document.getElementById("reqEmail").value;
    const product = document.getElementById("reqProduct").value;

    if (!name || !email || !product) {
        document.getElementById("reqMessage").innerText = "Fill all fields.";
        return;
    }

    btn.innerText = "Sending...";
    try {
        const response = await fetch("https://shopsphere-backend-wr5o.onrender.com/requests", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, product })
        });
        const data = await response.json();
        document.getElementById("reqMessage").innerText = data.success ? "Request sent! ✅" : "Error sending request.";
    } catch {
        document.getElementById("reqMessage").innerText = "Network error.";
    } finally {
        btn.innerText = "Send Request";
    }
}

// Search & Filter
document.getElementById("search").oninput = 
document.getElementById("category").onchange = () => {
    const q = document.getElementById("search").value.toLowerCase();
    const cat = document.getElementById("category").value;
    render(allProducts.filter(p => 
        (p.name || "").toLowerCase().includes(q) && 
        (!cat || p.category === cat)
    ));
};
</script>
</body>
</html>
