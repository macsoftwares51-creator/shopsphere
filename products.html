<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Official Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* Entrance Animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Universal Sizing Structure Rule */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e293b, #030712);
            color: var(--text-main);
            padding: 0 20px 40px;
            min-height: 100vh;
            overflow-x: hidden;
            width: 100%;
        }

        /* Explicit Safe Component Micro-Transitions */
        .btn-gold, .add-btn, .nav-btn, .card, input, select, textarea {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
        }

        /* ==========================================================
           BULLETPROOF MOBILE STICKY COMBO SYSTEM
           ========================================================== */
        
        /* This container group anchors everything together naturally on mobile */
        .sticky-nav-group {
            position: sticky;
            top: 10px;
            z-index: 1000;
            max-width: 1200px;
            margin: 10px auto 30px;
            display: flex;
            flex-direction: column;
            pointer-events: none; /* Prevents the invisible container from blocking clicks */
        }

        header.navbar {
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 25px;
            display: flex; justify-content: space-between; align-items: center;
            width: 100%;
            pointer-events: auto; /* Restores click tracking for buttons */
            transition: border-radius 0.2s ease, background-color 0.2s ease, margin-bottom 0.2s ease;
        }

        /* When sticky attaches, flatten bottom edges */
        .sticky-nav-group.stuck header.navbar {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-bottom-color: transparent;
            background: rgba(3, 7, 18, 0.95);
        }

        /* Sub Navigation Filtering Interface Layout */
        .sub-navbar {
            background: rgba(17, 24, 39, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: 100%;
            margin-top: 15px; /* Creates spacing when floating normally */
            pointer-events: auto; /* Restores input fields typing */
            transition: border-radius 0.2s ease, background-color 0.2s ease, padding 0.2s ease, margin-top 0.2s ease;
        }

        /* When sticky attaches, snap up perfectly against the main navbar */
        .sticky-nav-group.stuck .sub-navbar {
            margin-top: 0;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            border-top-color: rgba(255, 255, 255, 0.05);
            background: rgba(3, 7, 18, 0.95);
            padding: 8px 25px;
        }

        /* ========================================================== */

        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
        .brand img { height: 40px; border-radius: 8px; }
        .brand span { font-size: 20px; font-weight: 800; letter-spacing: -1px; }

        .nav-btn {
            background: var(--accent); color: #000;
            padding: 8px 18px; border-radius: 12px;
            text-decoration: none; font-weight: 700; font-size: 14px;
            position: relative;
        }

        #cart-badge {
            position: absolute; top: -8px; right: -8px;
            background: #ef4444; color: white; font-size: 11px;
            font-weight: 800; width: 20px; height: 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg); transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .badge-pop { transform: scale(1) !important; }

        /* Request Bento Section */
        .request-section {
            max-width: 1200px; margin: 0 auto 50px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(17, 24, 39, 0.7));
            padding: 30px; border-radius: 32px;
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center;
        }

        .request-form { display: flex; flex-direction: column; gap: 12px; }
        input, select, textarea {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            color: white; padding: 12px 16px; border-radius: 14px; outline: none;
        }
        .btn-gold { 
            background: #fbbf24; color: #000; border: none; padding: 14px; 
            border-radius: 14px; font-weight: 800; cursor: pointer;
        }

        .search-wrapper { position: relative; flex: 1; max-width: 400px; }
        .search-wrapper input {
            width: 100%; padding: 12px 16px 12px 42px;
            background: rgba(3, 7, 18, 0.6); border: 1px solid var(--glass-border);
            border-radius: 14px; color: white; font-family: inherit; transition: padding 0.2s ease;
        }

        .sticky-nav-group.stuck .search-wrapper input { padding-top: 8px; padding-bottom: 8px; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 15px; pointer-events: none; }

        .filter-wrapper { display: flex; align-items: center; gap: 12px; }
        .filter-wrapper label { font-size: 12px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .filter-wrapper select {
            background: rgba(3, 7, 18, 0.6); border: 1px solid var(--glass-border);
            color: white; padding: 12px 20px; border-radius: 14px; cursor: pointer; font-family: inherit; transition: padding 0.2s ease;
        }
        .sticky-nav-group.stuck .filter-wrapper select { padding-top: 8px; padding-bottom: 8px; }

        /* Product Grid */
        .grid {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .card { background: var(--card-bg); backdrop-filter: blur(8px); border: 1px solid var(--glass-border); padding: 20px; border-radius: 28px; opacity: 0; }
        .reveal { animation: fadeInUp 0.6s forwards; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 20px; cursor: zoom-in; }
        .card h3 { margin: 15px 0 5px; font-size: 18px; font-weight: 700; color: white; }
        .card p { color: var(--text-dim); font-size: 13px; margin-bottom: 15px; text-transform: uppercase; }
        .price { color: var(--accent); font-size: 20px; font-weight: 800; display: block; margin-bottom: 15px; }

        .add-btn { background: var(--accent); color: #000; border: none; width: 100%; padding: 12px; border-radius: 14px; font-weight: 800; cursor: pointer; }
        .add-btn:active { transform: scale(0.95); }

        #imageModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:2000; }

       @media (max-width: 768px) {
            .request-section { grid-template-columns: 1fr; text-align: center; }
            
            /* FORCE 2 COLUMNS ON MOBILE */
            .grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px; /* Slightly tighter gap so cards fit nicely on small screens */
            }

            /* Optimize padding inside the cards for tight mobile spacing */
            .card {
                padding: 12px;
                border-radius: 20px;
            }
            .card img {
                height: 140px; /* Reduce image height slightly so it doesn't distort the card proportions */
                border-radius: 14px;
            }
            .card h3 {
                font-size: 14px; /* Slightly smaller text so titles don't wrap onto 3+ lines */
                margin: 10px 0 4px;
            }
            .card p {
                font-size: 11px;
                margin-bottom: 8px;
            }
            .price {
                font-size: 16px;
                margin-bottom: 10px;
            }
            .add-btn {
                padding: 10px;
                font-size: 13px;
                border-radius: 10px;
            }
            
            .sticky-nav-group { margin: 5px 10px 20px; top: 5px; }
            header.navbar { padding: 10px 15px; }
            .sub-navbar { padding: 10px 15px; gap: 10px; margin-top: 10px; }

            .search-wrapper { max-width: 60%; }
            .filter-wrapper { max-width: 40%; gap: 6px; }
            .filter-wrapper label { display: none; } 
            
            .search-wrapper input { padding: 10px 10px 10px 32px; font-size: 13px; }
            .search-icon { left: 10px; font-size: 13px; }
            .filter-wrapper select { padding: 10px 10px; font-size: 13px; width: 100%; }
        }

        @media (max-width: 400px) {
            .sub-navbar { flex-direction: column; align-items: stretch; }
            .search-wrapper, .filter-wrapper { max-width: 100%; }
            .filter-wrapper select { width: 100%; }
            .sticky-nav-group.stuck .sub-navbar { margin-top: 10px; border-radius: 20px; }
        }
    </style>
</head>
<body>

<div id="imageModal" onclick="this.style.display='none'">
    <img id="modalImg" style="max-width:90%; max-height:90%; border-radius:15px;">
</div>

<section class="request-section">
    <div>
        <h2 style="margin-bottom: 10px;">Missing something?</h2>
        <p style="color: var(--text-dim);">Tell us what you're looking for and we'll source it for you at the best price.</p>
        <p style="font-size: 12px; color: var(--accent); font-weight: bold;">⚡ Ready in 10-30s if server is sleeping.</p>
    </div>
    <div class="request-form">
        <input id="reqName" placeholder="Your Name">
        <input id="reqEmail" placeholder="Your Email">
        <textarea id="reqProduct" placeholder="Item details (Size, color, brand)..." rows="3"></textarea>
        <button class="btn-gold" onclick="sendRequest()">Send Request</button>
        <p id="reqMessage" style="font-size: 14px; text-align: center; margin: 0;"></p>
    </div>
</section>

<div class="sticky-nav-group">
    <header class="navbar">
        <a href="home.html" class="brand">
            <img src="logo3.1.png" alt="ShopSphere">
            <span>ShopSphere</span>
        </a>
        <nav style="display: flex; gap: 10px;">
            <a class="nav-btn" href="home.html" style="background: rgba(255,255,255,0.1); color: white;">Home</a>
            <a class="nav-btn" href="cart.html" style="background: white;">
                🛒 Cart <span id="cart-badge">0</span>
            </a>
        </nav>
    </header>

    <div class="sub-navbar">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input id="search" type="text" placeholder="Search products...">
        </div>

        <div class="filter-wrapper">
            <label for="category">Category</label>
            <select id="category">
                <option value="">All Categories</option>
            </select>
        </div>
    </div>
</div>

<div class="grid" id="products"></div>

<script src="products.js"></script>
<script src="shopbuddy.js"></script>

<script>
    const navGroup = document.querySelector('.sticky-nav-group');
    
    if (navGroup) {
        // Track precisely when the entire nav container group docks against the ceiling boundary
        window.addEventListener('scroll', () => {
            if (navGroup.getBoundingClientRect().top <= 11) {
                navGroup.classList.add('stuck');
            } else {
                navGroup.classList.remove('stuck');
            }
        });
    }
</script>
</body>
</html>
