<!DOCTYPE html>
<html>
<head>
<title>ShopSphere Products</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

<style>
body {
  font-family: raleway;
  background: #050018;
  color: rgb(36, 134, 7);
  margin: 0;
  padding: 20px;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: rgb(7, 236, 57);
}

.brand img { height: 92px; }
.brand span { font-size: 32px; font-weight: bold; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: #420629;
  padding: 15px;
  border-radius: 12px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 35px rgba(0,0,0,0.35);
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

.old-price {
  text-decoration: line-through;
  color: #999;
  font-size: 14px;
}

.price {
  color: #e3e4e1;
  font-weight: bold;
}

button{
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  border: none;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
}

button:hover{
  transform: translateY(-2px);
}

input, select {
  padding: 10px;
  border-radius: 6px;
  border: none;
  width: 200px;
}
</style>
</head>
<div id="imageModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:1000;
">
  <img id="modalImg" style="max-width:90%; max-height:90%; border-radius:10px;" />
</div>
<body>

<header class="navbar">
  <a href="home.html" class="brand">
    <img src="logo3.1.png">
    <span>ShopSphere</span>
  </a>
</header>

<p>Wait 10–30 seconds if server is waking up.</p>

<header>
  <input id="search" placeholder="Search product..." />
  <select id="category">
    <option value="">All categories</option>
  </select>
</header>

<div class="grid" id="products"></div>

<script>

function addToCart(name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const existing = cart.find(item => item.name === name);

  if (existing) {
    existing.qty++;
  } else {
    cart.push({ name, price, qty: 1 });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added to cart");
}

let allProducts = [];

fetch("https://shopsphere-backend-wr5o.onrender.com/products")
  .then(res => res.json())
  .then(data => {
    console.log("Products:", data);
    allProducts = data;
    fillCategories(data);
    render(data);
  })
  .catch(error => console.error("Error loading products:", error));

function fillCategories(products) {
  const select = document.getElementById("category");
  const categories = [...new Set(products.map(p => p.category).filter(Boolean))];

  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    select.appendChild(opt);
  });
}
function openImage(src){
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImg");

  modalImg.src = src;
  modal.style.display = "flex";
}

document.getElementById("imageModal").onclick = function(){
  this.style.display = "none";
};
function render(products) {
  const box = document.getElementById("products");
  box.innerHTML = "";

  products.forEach(p => {

    const name = p.name || "No Name";
    const category = p.category || "No Category";
    const price = Number(p.price) || 0;
    const image = p.image || "https://via.placeholder.com/200";

    const cancelledPrice = Math.round((price * 1.3) / 10) * 10;

    box.innerHTML += `
      <div class="card">
        <img src="${product.image}">
        <h3>${name}</h3>
        <p>${category}</p>

        <div class="old-price">Kshs ${cancelledPrice}</div>
        <div class="price">Kshs ${price}</div>

        <button onclick="addToCart('${name}', ${price})">
          Add to Cart
        </button>
      </div>
    `;
  });
}

document.getElementById("search").oninput =
document.getElementById("category").onchange = () => {
  const q = search.value.toLowerCase();
  const cat = category.value;

  render(allProducts.filter(p =>
    (p.name || "").toLowerCase().includes(q) &&
    (!cat || p.category === cat)
  ));
};

</script>

</body>
</html>
