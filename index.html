<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | ShopSphere</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-off: #121417;
            --bg-on: #1c1f24;
            --lamp-color: #f5f5dc;
            --accent: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-off);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            transition: background 0.6s ease;
        }

        /* --- THE LAMP CSS --- */
        .lamp-container {
            position: relative;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .lamp-top {
            width: 120px;
            height: 60px;
            background: var(--lamp-color);
            border-radius: 60px 60px 0 0;
            position: relative;
            z-index: 2;
            transition: box-shadow 0.4s ease;
        }

        /* The Glow effect when ON */
        body[data-on="true"] .lamp-top {
            box-shadow: 0 -10px 50px rgba(245, 245, 220, 0.6), 
                        0 0 100px rgba(245, 245, 220, 0.2);
        }

        .lamp-neck {
            width: 12px;
            height: 100px;
            background: var(--lamp-color);
            margin-top: -2px;
        }

        .lamp-base {
            width: 80px;
            height: 12px;
            background: var(--lamp-color);
            border-radius: 10px 10px 0 0;
        }

        /* The Pull String */
        .pull-string {
            position: absolute;
            width: 2px;
            height: 70px;
            background: #555;
            left: 70%;
            top: 50px;
            transition: transform 0.1s ease;
        }

        .pull-bead {
            position: absolute;
            bottom: -8px;
            left: -3px;
            width: 8px;
            height: 8px;
            background: #cd7f32;
            border-radius: 50%;
        }

        /* --- THE LOGIN BOX --- */
        .box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 24px;
            width: 340px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Shows when lamp is "ON" */
        .box.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 { margin-bottom: 10px; color: white; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            cursor: pointer;
        }

        .primary { background: var(--accent); color: #052e16; }
        .secondary { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); margin-top: 8px; }

        .hint {
            position: absolute;
            top: -30px;
            font-size: 12px;
            color: var(--accent);
            font-weight: bold;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .global-theme-toggle {
        background: var(--card-bg, rgba(17, 24, 39, 0.7));
        border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
        color: var(--text-main, #fff);
        cursor: pointer;
        padding: 10px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }
    .global-theme-toggle:hover { transform: scale(1.05); }
    .theme-icon-slot { font-size: 16px; line-height: 1; }
    </style>
</head>

<body data-on="false">

    <div class="lamp-container" onclick="toggleLamp()">
        <div class="hint" id="hint">Tap string to start</div>
        <div class="lamp-top"></div>
        <div class="lamp-neck"></div>
        <div class="lamp-base"></div>
        <div class="pull-string" id="string">
            <div class="pull-bead"></div>
        </div>
    </div>

    <div class="box" id="loginForm">
         <button class="global-theme-toggle" id="theme-switch-btn" onclick="toggleGlobalTheme()" title="Switch Theme">
    <span class="theme-icon-slot">☀️</span>
</button>
        <h2>ShopSphere</h2>
        <div class="subtitle">Illuminate your shopping experience</div>

        <input id="name" placeholder="Your Name">
        <input id="email" placeholder="Email (optional)">

        <button class="primary" onclick="createAccount()">Sign In</button>
        <button class="secondary" onclick="continueGuest()">Guest Access</button>
    </div>
<script src="theme-manager.js"></script>
    <script src = "index.js"> </script>
    <script src="shop-bot.js"></script>
</body>
</html>
