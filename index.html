<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | ShopSphere</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- SEO Meta Tags for Free Domains -->
    <meta name="description" content="ShopSphere - Shop official quality products online at the best prices. Find everything you need on our platform.">
    <meta name="keywords" content="ShopSphere, shopsphere, online shopping Kenya, e-commerce">
    <meta name="robots" content="index, follow">
    <style>
        :root { --bg: #121417; --accent: #22c55e; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 24px 0;
            transition: background 0.6s ease;
        }

        .auth-stage {
            position: relative;
            width: min(340px, calc(100vw - 32px));
            min-height: 560px;
            perspective: 1200px;
        }

        .preloader-card {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            width: 84px;
            height: 84px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: white;
            background: linear-gradient(145deg, #1f2937, #0f172a);
            border: 1px solid rgba(34, 197, 94, .55);
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,.45), 0 0 35px rgba(34,197,94,.16);
            transform: translate(-50%, -50%) rotateY(0deg);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            animation: none;
            pointer-events: none;
        }

        .preloader-card img { width: 46px; height: 46px; object-fit: contain; border-radius: 50%; }
        .preloader-card span { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; color: var(--accent); }

        @keyframes growAndReveal {
            0% { width: 84px; height: 84px; border-radius: 18px; transform: translate(-50%, -50%) rotateY(0deg); }
            62% { width: 100%; height: 100%; border-radius: 24px; transform: translate(-50%, -50%) rotateY(0deg); }
            100% { width: 100%; height: 100%; border-radius: 24px; transform: translate(-50%, -50%) rotateY(180deg); opacity: 0; }
        }

        /* --- THE LOGIN BOX --- */
        .box {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            height: 100%;
            text-align: center;
            opacity: 0;
            transform: rotateY(-180deg) scale(.98);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            pointer-events: none;
            transition: opacity .55s ease, transform .7s cubic-bezier(.2,.75,.2,1), box-shadow .55s ease;
        }

        .auth-stage.revealed .box {
            opacity: 1;
            transform: rotateY(0deg) scale(1);
            pointer-events: all;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 { margin-bottom: 10px; color: white; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }

        .auth-form { display: grid; gap: 4px; }
        .auth-form input { margin: 5px 0; }
        .auth-switch { color: #94a3b8; font-size: 12px; margin-top: 16px; }
        .auth-switch button { width: auto; padding: 0; margin: 0 0 0 4px; color: var(--accent); background: transparent; }
        .auth-message { min-height: 18px; color: #fca5a5; font-size: 12px; margin-top: 10px; }
        .secondary:disabled, .primary:disabled { opacity: .65; cursor: wait; }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            cursor: pointer;
        }

        .primary { background: var(--accent); color: #052e16; }
        .secondary { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); margin-top: 8px; }

        @media (max-height: 520px) { body { justify-content: flex-start; } }
    </style>
</head>

<body>
    <main class="auth-stage" id="authStage" aria-live="polite">
        <div class="preloader-card" id="preloaderCard" aria-label="Loading ShopSphere">
            <img src="assets/logo3.1.png" alt="ShopSphere logo">
            <span>ShopSphere</span>
        </div>

        <div class="box" id="loginForm">
        <h2 id="authTitle">Create your account</h2>
        <div class="subtitle" id="authSubtitle">Secure checkout, saved details, and order updates.</div>

        <form class="auth-form" id="authForm" novalidate>
            <input id="name" name="name" autocomplete="name" placeholder="Full name" maxlength="50" required>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" maxlength="254" required>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Password (12+ characters)" maxlength="128" required>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" maxlength="128" required>
            <button class="primary" id="submitAuth" type="submit">Create account</button>
        </form>
        <p class="auth-message" id="authMessage" role="alert" aria-live="polite"></p>
        <p class="auth-switch"><span id="authSwitchText">Already have an account?</span><button class="secondary" id="authSwitch" type="button">Sign in</button></p>
        <button class="secondary" id="guestAccess" type="button">Continue as guest</button>
        </div>
    </main>
    <script src="js/index.js"></script>
    <script src="js/shop-bot.js"></script>
</body>
</html>
