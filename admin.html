<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<style>
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(to right, #0f172a, #1e293b);
  font-family: Arial;
}

.box {
  background: white;
  padding: 40px;
  border-radius: 10px;
  width: 320px;
  text-align: center;
}

input {
  width: 100%;
  padding: 12px;
  margin: 15px 0;
}

button {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover { background: #16a34a; }
#error { color: red; margin-top: 10px; }
</style>
</head>

<body>

<div class="box">
  <h2>Admin Login</h2>
  <input type="password" id="password" placeholder="Admin password">
  <button onclick="login()">Login</button>
  <p id="error"></p>
</div>

<script>
const ADMIN_PASSWORD = "Godisable"; 

function login() {
  const input = document.getElementById("password").value;

  if (input === ADMIN_PASSWORD) {
    location.href = "add-product.html";
  } else {
    document.getElementById("error").innerText = "Wrong password";
  }
}
</script>

</body>
</html>
