<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Verification | ShopSphere Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.25s ease; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 100% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container { max-width: 1100px; margin: auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        .brand-zone h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -1px; }
        .brand-zone p { color: var(--text-dim); margin: 5px 0 0; font-size: 14px; }

        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:hover { transform: rotate(5deg) scale(1.05); background: #2563eb; }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .img-container {
            width: 100%;
            height: 200px;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--success);
            color: #052e16;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
        }

        .card-body { padding: 20px; flex-grow: 1; }

        .card-body h3 { margin: 0 0 10px 0; font-size: 20px; }
        
        .seller-info {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .seller-info div { margin-bottom: 4px; color: var(--text-dim); }
        .seller-info b { color: white; }

        .description {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .status-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .buttons { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-approve { background: var(--success); color: #052e16; }
        .btn-approve:hover { filter: brightness(1.1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }

        .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-delete:hover { background: var(--danger); color: white; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<div class="container">
    <header>
        <div class="brand-zone">
            <h1>Seller Submissions</h1>
            <p>Review and verify products from community partners</p>
        </div>
        <button class="refresh-btn" onclick="loadRequests()">
            🔄 Refresh List
        </button>
    </header>

    <div id="SellerRequests" class="grid">
        <p style="text-align: center; grid-column: 1/-1; color: var(--text-dim);">Scanning for new requests...</p>
    </div>
</div>

<script>
const API = "https://shopsphere-backend-wr5o.onrender.com/SellerRequest";

async function loadRequests(){
    try {
        const res = await fetch(API);
        const data = await res.json();
        const container = document.getElementById("SellerRequests");

        if(!data || data.length === 0){
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 100px 0;">
                    <h2 style="color: var(--text-dim);">Inbox Empty</h2>
                    <p>No pending seller requests at the moment.</p>
                </div>`;
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="card">
                <div class="img-container">
                    <img src="${item.image}" alt="product">
                    <div class="price-tag">KES ${Number(item.price).toLocaleString()}</div>
                </div>

                <div class="card-body">
                    <div class="status-area">
                        <span class="status-label">${item.status || 'Reviewing'}</span>
                        <a href="mailto:${item.email}" style="color:var(--accent); text-decoration:none; font-size:12px;">Contact Seller</a>
                    </div>
                    
                    <h3>${item.productName}</h3>

                    <div class="seller-info">
                        <div>Seller: <b>${item.name}</b></div>
                        <div>Email: <b>${item.email}</b></div>
                    </div>

                    <p class="description">${item.description}</p>

                    <div class="buttons">
                        <button class="btn btn-approve" onclick="approve('${item._id}')">
                            Verify & Post
                        </button>
                        <button class="btn btn-delete" onclick="removeRequest('${item._id}')">
                            Reject
                        </button>
                    </div>
                </div>
            </div>
        `).join("");
    } catch (error) {
        document.getElementById("SellerRequests").innerHTML = "<p style='color:red; text-align:center;'>Failed to connect to Command Center.</p>";
    }
}

async function approve(id){
    try {
        const res = await fetch(API + "/" + id, { method: "PUT" });
        if(res.ok) {
            alert("✅ Product approved and moved to live store.");
            loadRequests(); // Corrected function call
        }
    } catch (err) {
        alert("Approval failed.");
    }
}

async function removeRequest(id){
    if(!confirm("Are you sure you want to REJECT this seller request? This cannot be undone.")) return;

    try {
        const res = await fetch(API + "/" + id, { method: "DELETE" });
        if(res.ok) loadRequests();
    } catch (err) {
        alert("Delete failed.");
    }
}

// Initial Load
loadRequests();
</script>

</body>
</html>
