<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Delivery Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            padding: 20px; 
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 30px; 
            border-radius: 24px; 
            max-width: 450px;
            width: 100%;
        }
        h2 { font-weight: 800; margin-top: 0; letter-spacing: -1px; color: white; }
        label { font-size: 13px; font-weight: 600; color: var(--accent); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group { margin-bottom: 18px; position: relative; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        /* ADVANCED SCROLLABLE SUGGESTION WINDOW */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #111827;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            max-height: 260px; /* Limits size to force scroll window behavior */
            overflow-y: auto;
            z-index: 999;
            display: none;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.7);
            margin-top: 5px;
            padding: 6px;
        }
        
        /* Modern Scrollbar Formatting */
        .search-results::-webkit-scrollbar { width: 6px; }
        .search-results::-webkit-scrollbar-track { background: transparent; }
        .search-results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        .search-results::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* VISUAL SUGGESTION ROW LAYOUT */
        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s;
            color: var(--text-main);
        }
        .search-item:hover { 
            background: rgba(255, 255, 255, 0.08); 
        }
        
        /* Thumbnail Box Frame */
        .search-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            background: #1f2937;
            border: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0; /* Keeps images crisp and circular/square without flattening */
        }
        
        .search-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0; /* Allows text truncation bounds inside flexboxes */
        }
        .search-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }
        .search-price {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
        }

        .selected-badge {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 6px;
            display: none;
            font-weight: 600;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            margin-bottom: 10px;
        }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        
        button { font-family: 'Inter', sans-serif; font-weight: 700; border-radius: 12px; cursor: pointer; border: none; padding: 14px; }
        .btn-submit { background: var(--accent); color: #000; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn-clear { background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); width: 100%; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px;">
        <div>
            <h2 style="margin: 0;">Delivery Receipt</h2>
            <p style="color: var(--text-dim); margin: 5px 0 0 0; font-size: 14px;">Order Context ID: <strong id="orderDisplay" style="color: white;">Loading...</strong></p>
        </div>
        <a href="view-proofs.html" style="background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--glass-border); text-decoration: none; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--glass-border)'">
            📂 View Logs
        </a>
    </div>

    <div class="input-group">
        <label>2. Customer Name</label>
        <input type="text" id="customerName" placeholder="Enter full name">
    </div>

    <div class="input-group">
        <label>3. Verification / Delivery Code</label>
        <input type="text" id="deliveryCode" placeholder="Enter delivery pin or code">
    </div>

    <div class="input-group">
        <label>4. Customer Signature</label>
        <div class="canvas-wrapper">
            <canvas id="signature-pad"></canvas>
        </div>
        <button id="clear" class="btn-clear">Clear Signature</button>
    </div>
    
    <button id="submit" class="btn-submit">COMPLETE DELIVERY</button>
</div>

<script src="Delivery.js"></script>
</body>
</html>
