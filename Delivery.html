<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Delivery Proof</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            padding: 20px; 
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 30px; 
            border-radius: 24px; 
            max-width: 450px;
            width: 100%;
        }
        h2 { font-weight: 800; margin-top: 0; letter-spacing: -1px; color: white;}
        label { font-size: 14px; font-weight: 600; color: var(--accent); display: block; margin-bottom: 8px; }
        .input-group { margin-bottom: 20px; }
        
        /* Fixed canvas structural layout */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            margin-bottom: 10px;
        }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        
        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed var(--glass-border);
            border-radius: 12px;
            color: var(--text-dim);
            font-size: 13px;
        }
        button { font-family: 'Inter', sans-serif; font-weight: 700; border-radius: 12px; cursor: pointer; border: none; padding: 14px; }
        .btn-submit { background: var(--accent); color: #000; width: 100%; font-size: 16px; margin-top: 15px; }
        .btn-clear { background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); width: 100%; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Delivery Proof</h2>
    <p style="color: var(--text-dim); margin-bottom: 25px;">Order Reference: <strong id="orderDisplay" style="color: white;">Loading...</strong></p>

    <div class="input-group">
        <label>1. Capture Package Delivery Photo</label>
        <input type="file" id="photoInput" accept="image/*" capture="environment">
    </div>

    <div class="input-group">
        <label>2. Customer Signature</label>
        <div class="canvas-wrapper">
            <canvas id="signature-pad"></canvas>
        </div>
        <button id="clear" class="btn-clear">Clear Signature</button>
    </div>
    
    <button id="submit" class="btn-submit">UPLOAD SYSTEM PROOF</button>
</div>

<script src="Delivery.js"></script>
</body>
</html>
