<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopsphere Delivery Proof</title>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        canvas { border: 2px solid #333; width: 100%; height: 200px; background: #fff; border-radius: 5px; }
        button { background: #25D366; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Shopsphere PoD</h2>
    <p>Order ID: <b id="orderDisplay">Loading...</b></p>

    <label>1. Take Product Photo</label><br>
    <input type="file" id="photoInput" accept="image/*" capture="environment"><br>

    <label>2. Customer Signature</label>
    <canvas id="signature-pad"></canvas>
    
    <button id="clear">Clear Signature</button>
    <button id="submit">UPLOAD PROOF</button>
</div>

<script>
   
</script>
</body>
</html>
