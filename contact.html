<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #1e1b4b, #030712);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header.navbar {
            position: fixed; top: 15px;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 20px;
            display: flex; gap: 15px;
            z-index: 1000;
        }

        .nav-btn {
            background: transparent; color: white;
            padding: 8px 16px; border-radius: 12px;
            text-decoration: none; font-weight: 600; font-size: 14px;
            border: 1px solid var(--glass-border);
        }

        .contact-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.6s ease-out;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 36px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1.5px; }
        p { color: var(--text-dim); line-height: 1.6; margin-bottom: 30px; }

        .wa-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            padding: 18px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2);
        }

        .wa-button:hover { transform: translateY(-5px); filter: brightness(1.1); }

        .hours-box {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .hours-box h3 { font-size: 12px; text-transform: uppercase; color: var(--accent); letter-spacing: 2px; margin-top: 0; }
        .hours-box span { font-size: 15px; font-weight: 500; }

        .footer-note { font-size: 12px; color: var(--text-dim); margin-top: 20px; }
        .global-theme-toggle {
        background: var(--card-bg, rgba(17, 24, 39, 0.7));
        border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
        color: var(--text-main, #fff);
        cursor: pointer;
        padding: 10px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }
    .global-theme-toggle:hover { transform: scale(1.05); }
    .theme-icon-slot { font-size: 16px; line-height: 1; }

    </style>
</head>
<body>

    <header class="navbar">
        <a class="nav-btn" href="home.html">Home</a>
        <a class="nav-btn" href="products.html">Store</a>
        <button class="global-theme-toggle" id="theme-switch-btn" onclick="toggleGlobalTheme()" title="Switch Theme">
    <span class="theme-icon-slot">🌙</span>
</button>
    </header>

    <div class="contact-card">
        <h1>Get in Touch</h1>
        <p>Whether it's a delivery update or a product inquiry, our team is standing by.</p>

        <a href="https://wa.me/254111803422" target="_blank" class="wa-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.937 3.659 1.432 5.631 1.433h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
            Chat on WhatsApp
        </a>

        <div class="hours-box">
            <h3>Support Hours</h3>
            <span>Mon – Sat, 8:00 AM – 6:00 PM</span>
        </div>

        <p class="footer-note">Typical response time: Under 5 minutes</p>
    </div>
    <script src="theme-manager.js"></script>
    <script src="shopbuddy.js"></script>
    <script src="shop-bot.js"></script>
</body>
</html>
