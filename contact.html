<!DOCTYPE html>
<html>
<head>
<title>Contact Us – ShopSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
<style>
body {
  font-family: lobster;
  background: #240c42;
  color: white;
  padding: 30px;
}

.container {
  max-width: 800px;
  margin: auto;
  text-align: center;
}

.box {
  background: #420629;
  padding: 25px;
  border-radius: 12px;
}

h1 {
  color: #22c55e;
}

p {
  font-size: 16px;
}

a {
  color: #22c55e;
  text-decoration: none;
  font-weight: bold;
}
    .nav-btn{
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  padding:10px 16px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  transition:0.25s;
}

.nav-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 15px rgba(0,0,0,0.35);
}

/* Click effect */
nav-btn:active{
  transform: scale(0.97);
}
</style>
</head>

<body>

<div class="container">
  <nav class="navbar">
    <a class="nav-btn" href="home.html">home</a>
  </nav>
  <div class="box">
    
    <h1>Contact Us</h1>
    <p>We’re happy to help with orders, returns, and inquiries.</p>

    <p>
      📱 WhatsApp: <br>
      <a href="https://wa.me/254705779593" target="_blank">
        Chat with us on WhatsApp
      </a>
    </p>

    <p>
      ⏰ Support Hours: <br>
      Monday – Saturday, 8:00 AM – 6:00 PM
    </p>
  </div>
</div>

</body>
</html>
