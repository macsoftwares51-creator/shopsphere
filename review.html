<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            padding: 80px 20px 40px;
        }

        header.navbar {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 10px 20px; display: flex; gap: 15px; z-index: 1000;
        }

        .nav-btn {
            background: transparent; color: white; padding: 8px 16px; 
            border-radius: 12px; text-decoration: none; font-weight: 600; 
            font-size: 13px; border: 1px solid var(--glass-border);
        }

        .container { max-width: 1000px; margin: auto; }

        h1 { font-size: 42px; font-weight: 800; text-align: center; margin-bottom: 40px; letter-spacing: -2px; }

        /* Review Grid */
        #reviewList {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px; margin-bottom: 60px;
        }

        .review-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            padding: 25px; border-radius: 24px;
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-card b { font-size: 18px; color: var(--accent); display: block; margin-bottom: 5px; }
        .stars { color: #fbbf24; margin-bottom: 10px; }
        .review-card p { color: var(--text-dim); line-height: 1.6; font-style: italic; }

        /* Submission Form */
        .form-card {
            max-width: 600px; margin: 0 auto;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 32px;
        }

        .form-card h2 { margin-top: 0; font-size: 24px; }

        input, select, textarea {
            width: 100%; padding: 14px; margin-bottom: 15px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 14px; color: white; outline: none;
        }

        textarea { height: 100px; resize: none; }

        button {
            width: 100%; padding: 16px; background: var(--accent);
            color: black; border: none; border-radius: 14px;
            font-weight: 800; cursor: pointer;
        }

        #msg { text-align: center; margin-top: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <header class="navbar">
        <a class="nav-btn" href="home.html">Home</a>
        <a class="nav-btn" href="products.html">Store</a>
    </header>

    <div class="container">
        <h1>Wall of Love</h1>
        
        <div id="reviews-List">
            </div>

        <div class="form-card">
            <h2>Share your experience</h2>
            <input id="revName" placeholder="Your Name">
            <select id="revRating">
                <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
                <option value="4">⭐⭐⭐⭐ (Good)</option>
                <option value="3">⭐⭐⭐ (Average)</option>
                <option value="2">⭐⭐ (Poor)</option>
                <option value="1">⭐ (Bad)</option>
            </select>
            <textarea id="revComment" placeholder="Tell others what you think..."></textarea>
            <button onclick="submitReview()">Submit Review</button>
            <p id="msg"></p>
        </div>
    </div>

    <script>
        // 1. Correct the API URL (Remove '/approved' from the end)
const API = "https://shopsphere-backend-wr5o.onrender.com";

async function loadReviews() {
    // We add ?cb=1 to "bust" the cache
    const res = await fetch("https://shopsphere-backend-wr5o.onrender.com/Review?cb=1");
    
    if (!res.ok) {
        console.error("HTTP Error:", res.status);
        return;
    }

    const reviews = await res.json();
    const container = document.getElementById("reviews-list");
    
    if (!container) return;
    container.innerHTML = "";

    reviews.forEach(r => {
        container.innerHTML += `
            <div class="review-card">
                <strong>${r.name}</strong>
                <p>${"⭐".repeat(r.rating)}</p>
                <p>${r.comment}</p>
            </div>
        `;
    });
}
        async function submitReview() {
            const name = document.getElementById("revName").value;
            const rating = document.getElementById("revRating").value;
            const comment = document.getElementById("revComment").value;
            const msg = document.getElementById("msg");

            if(!name || !comment) return alert("Please fill all fields");

            const res = await fetch(API + "/Review", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, rating, comment })
            });

            if(res.ok) {
                msg.style.color = "#22c55e";
                msg.innerText = "Review submitted! It will appear once approved by admin. ✅";
                document.getElementById("revName").value = "";
                document.getElementById("revComment").value = "";
            } else {
                msg.style.color = "#ef4444";
                msg.innerText = "Error submitting review.";
            }
        }

        loadReviews();
    </script>
</body>
</html>
