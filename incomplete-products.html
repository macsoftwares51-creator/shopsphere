<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Incomplete Items Audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #ef4444; /* Alert Red for incomplete items */
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header.audit-header {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        .counter-badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .audit-card {
            background: var(--card-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .issue-tag {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 8px;
            width: fit-content;
        }

        .btn-back {
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<header class="audit-header">
    <div>
        <h1 style="margin: 0 0 5px 0; font-weight: 800; letter-spacing: -1px;">Incomplete Products</h1>
        <p style="margin: 0; color: var(--text-dim); font-size: 14px;">Items missing descriptions, prices, or placeholder details.</p>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span class="counter-badge" id="issue-count">0 Items</span>
        <a href="products.html" class="btn-back">← Storefront</a>
    </div>
</header>

<main class="grid" id="audit-container"></main>
<div style="display: none;">
    <span id="cart-badge">0</span>
    <select id="category"></select>
    <div id="products"></div>
    <input id="search" type="text"> </div>

<script src="products.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("audit-container");
        const counter = document.getElementById("issue-count");

        // 1. Create a raw data viewer box at the top of the container
        const debugBox = document.createElement('pre');
        debugBox.style.cssText = "grid-column: 1/-1; background: #111827; padding: 15px; border: 1px dashed #fbbf24; color: #fbbf24; border-radius: 12px; font-size: 12px; max-height: 250px; overflow: auto; margin-bottom: 20px; font-family: monospace;";
        container.parentNode.insertBefore(debugBox, container);

        function runProductAudit() {
            // Unpack the global variable
            let rawData = typeof products !== 'undefined' ? products : (window.allProducts || null);
            
            // Print what the script sees into our debug box
            debugBox.textContent = `[DEBUG SYSTEM]\nData Type Detected: ${typeof rawData}\nIs Array? ${Array.isArray(rawData)}\nRaw Content Structure:\n${JSON.stringify(rawData, null, 2)}`;

            if (!rawData) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">📡 No products data source found yet...</div>`;
                return;
            }

            let allProducts = [];

            // Convert string JSON if needed
            if (typeof rawData === 'string') {
                try { allProducts = JSON.parse(rawData); } catch (e) {}
            } else if (Array.isArray(rawData)) {
                allProducts = rawData;
            } else if (rawData && typeof rawData === 'object') {
                allProducts = rawData.products || Object.values(rawData);
            }

            // Ensure we are operating on an array group
            if (!Array.isArray(allProducts) || allProducts.length === 0) {
                return;
            }

            // 2. Filter out items where details don't exist
            const incompleteItems = allProducts.filter(item => {
                // If item doesn't exist, skip safely
                if (!item) return false;

                // Check if details exist or are empty string/null
                const detailsValue = item.details ?? item.description ?? item.desc ?? null;
                const isMissingDetails = (detailsValue === null) || (String(detailsValue).trim() === "");
                
                const priceField = item.price || item.cost || 0;
                const isMissingPrice = !priceField || priceField === 0;

                return isMissingDetails || isMissingPrice;
            });

            counter.textContent = `${incompleteItems.length} Items Need Attention`;

            if (incompleteItems.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: #22c55e;">
                        <h2>🎉 Clean Audit! All live products have their details filled out.</h2>
                    </div>`;
                return;
            }

            // 3. Render cards
            container.innerHTML = incompleteItems.map(item => {
                return `
                    <div class="audit-card">
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                            <span class="issue-tag">❌ No Details Added Yet</span>
                        </div>
                        <h3 style="margin: 5px 0; color: white;">${item.title || item.name || "Unnamed Item"}</h3>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Category:</strong> ${item.category || 'Unassigned'}</p>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Price:</strong> KES ${item.price || '0'}</p>
                    </div>
                `;
            }).join('');
        }

        runProductAudit();

        // Check back for async delivery shifts
        const dataCheckInterval = setInterval(() => {
            let currentData = typeof products !== 'undefined' ? products : (window.allProducts || null);
            if (currentData) {
                runProductAudit();
                // If it successfully loaded structural items, clear the poller box interval safely
                let parsed = Array.isArray(currentData) ? currentData : (currentData.products || []);
                if (parsed.length > 0) clearInterval(dataCheckInterval);
            }
        }, 500);
    });
</script>
</body>
</html>
