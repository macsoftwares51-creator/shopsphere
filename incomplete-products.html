<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Incomplete Items Audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #ef4444; /* Alert Red for incomplete items */
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header.audit-header {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        .counter-badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .audit-card {
            background: var(--card-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .issue-tag {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 8px;
            width: fit-content;
        }

        .btn-back {
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<header class="audit-header">
    <div>
        <h1 style="margin: 0 0 5px 0; font-weight: 800; letter-spacing: -1px;">Incomplete Products</h1>
        <p style="margin: 0; color: var(--text-dim); font-size: 14px;">Items missing descriptions, prices, or placeholder details.</p>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span class="counter-badge" id="issue-count">0 Items</span>
        <a href="products.html" class="btn-back">← Storefront</a>
    </div>
</header>

<main class="grid" id="audit-container"></main>
<div style="display: none;">
    <span id="cart-badge">0</span>
    <select id="category"></select>
    <div id="products"></div>
</div>
<script src="products.js"></script>

<script>
 document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("audit-container");
    const counter = document.getElementById("issue-count");

    function runProductAudit() {
        // Look for your live data array (checking both local variables or window objects)
        const allProducts = typeof products !== 'undefined' ? products : (window.allProducts || []);
        
        if (allProducts.length === 0) {
            // If data hasn't arrived from the server yet, keep waiting
            container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">📡 Connecting to inventory stream...</div>`;
            return;
        }

        // 1. Filter items where the details property is totally missing (undefined), null, or blank
        const incompleteItems = allProducts.filter(item => {
            // Check all common naming variations you might use
            const detailsValue = item.details ?? item.description ?? item.desc ?? null;
            
            // It's incomplete if the key doesn't exist, is null, or is just empty whitespace
            const isMissingDetails = (detailsValue === null) || (String(detailsValue).trim() === "");
            
            const priceField = item.price || item.cost || 0;
            const isMissingPrice = !priceField || priceField === 0;

            return isMissingDetails || isMissingPrice;
        });

        counter.textContent = `${incompleteItems.length} Items Need Attention`;

        if (incompleteItems.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: #22c55e;">
                    <h2>🎉 Clean Audit! All live products have their details filled out.</h2>
                </div>`;
            return;
        }

        // 2. Render the items that only have basic info so far
        container.innerHTML = incompleteItems.map(item => {
            return `
                <div class="audit-card">
                    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <span class="issue-tag">❌ No Details Added Yet</span>
                    </div>
                    <h3 style="margin: 5px 0; color: white;">${item.title || item.name || "Unnamed Item"}</h3>
                    <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Category:</strong> ${item.category || 'Unassigned'}</p>
                    <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Price:</strong> KES ${item.price || '0'}</p>
                </div>
            `;
        }).join('');
    }

    // Run immediately
    runProductAudit();

    // Check back every 500ms until data arrives from your backend stream
    const dataCheckInterval = setInterval(() => {
        const currentProducts = typeof products !== 'undefined' ? products : (window.allProducts || []);
        if (currentProducts.length > 0) {
            runProductAudit();
            clearInterval(dataCheckInterval); // Stop checking once loaded
        }
    }, 500);
});
</script>
</body>
</html>
