<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Incomplete Items Audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #ef4444; /* Alert Red for incomplete items */
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header.audit-header {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        .counter-badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .audit-card {
            background: var(--card-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .issue-tag {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 8px;
            width: fit-content;
        }

        .btn-back {
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<header class="audit-header">
    <div>
        <h1 style="margin: 0 0 5px 0; font-weight: 800; letter-spacing: -1px;">Incomplete Products</h1>
        <p style="margin: 0; color: var(--text-dim); font-size: 14px;">Items missing descriptions, prices, or placeholder details.</p>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span class="counter-badge" id="issue-count">0 Items</span>
        <a href="products.html" class="btn-back">← Storefront</a>
    </div>
</header>

<main class="grid" id="audit-container"></main>
<div style="display: none;">
    <span id="cart-badge">0</span>
    <select id="category"></select>
    <div id="products"></div>
    <input id="search" type="text"> </div>

<script src="products.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("audit-container");
        const counter = document.getElementById("issue-count");
        const hiddenProductGrid = document.getElementById("products");

        // Temporary debug indicator inside the main grid area
        container.innerHTML = `<div id="audit-status" style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">📡 Watching backend stream for incoming products...</div>`;

        function checkHiddenProducts() {
            // Grab all individual product card elements that products.js injected into the hidden div
            // Adjust the selector (e.g., '.card' or 'div') based on what your layout creates
            const renderedCards = hiddenProductGrid.querySelectorAll('.card, [class*="card"], div > h3');
            
            if (renderedCards.length === 0) return;

            let incompleteItems = [];

            renderedCards.forEach(card) => {
                // Find the parent element card container
                const cardContainer = card.closest('.card') || card.parentElement;
                
                // Extract data directly from the DOM elements rendered by your script
                const title = cardContainer.querySelector('h3')?.textContent || "Unnamed Item";
                const priceText = cardContainer.querySelector('.price, [class*="price"]')?.textContent || "0";
                const category = cardContainer.querySelector('.category, p')?.textContent || "Unassigned";

                // Check your database's specific detail link setup or look inside the description element if it exists
                const detailsBtn = cardContainer.querySelector('button, a');
                const hasDetailsAdded = detailsBtn && !detailsBtn.textContent.includes("Add/Edit Details");

                // If it still has the "Add/Edit Details" button or lacks custom description text, it's incomplete!
                if (!hasDetailsAdded) {
                    incompleteItems.push({
                        title: title,
                        price: priceText,
                        category: category
                    });
                }
            });

            // Update the header counter indicator
            counter.textContent = `${incompleteItems.length} Items Need Attention`;

            if (incompleteItems.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: #22c55e;">
                        <h2>🎉 Clean Audit! All live products have their details filled out.</h2>
                    </div>`;
                return;
            }

            // Render the items onto the audit page layout view
            container.innerHTML = incompleteItems.map(item => {
                return `
                    <div class="audit-card">
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                            <span class="issue-tag">❌ No Details Added Yet</span>
                        </div>
                        <h3 style="margin: 5px 0; color: white;">${item.title}</h3>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Status:</strong> Basic Info Only</p>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Price / Info:</strong> ${item.price}</p>
                    </div>
                `;
            }).join('');
        }

        // 1. Run an immediate check in case it loaded fast
        setTimeout(checkHiddenProducts, 600);

        // 2. Set up a listener that triggers the moment your database data fills the hidden div
        const observer = new MutationObserver(() => {
            checkHiddenProducts();
        });

        if (hiddenProductGrid) {
            observer.observe(hiddenProductGrid, { childList: true, subtree: true });
        }
    });
</script>
</body>
</html>
