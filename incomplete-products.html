<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Incomplete Items Audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #ef4444; 
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header.audit-header {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        .counter-badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .audit-card {
            background: var(--card-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .issue-tag {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 8px;
            width: fit-content;
        }

        .btn-back {
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<header class="audit-header">
    <div>
        <h1 style="margin: 0 0 5px 0; font-weight: 800; letter-spacing: -1px;">Incomplete Products</h1>
        <p style="margin: 0; color: var(--text-dim); font-size: 14px;">Direct API live database audit filter.</p>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span class="counter-badge" id="issue-count">Connecting...</span>
        <a href="products.html" class="btn-back">← Storefront</a>
    </div>
</header>

<main class="grid" id="audit-container">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">📡 Connecting straight to Render API database instance...</div>
</main>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const container = document.getElementById("audit-container");
        const counter = document.getElementById("issue-count");

        // Change this URL string to match your exact live backend endpoint
        const BACKEND_API_URL = "https://shopsphere-backend.onrender.com/api/products"; 

        try {
            // 1. Fetch straight from the backend database endpoint
            const response = await fetch(BACKEND_API_URL);
            if (!response.ok) throw new Error("Database offline or rejected request stream");
            
            const allProducts = await response.json();

            // 2. Filter items where the details property is missing
            const incompleteItems = allProducts.filter(item => {
                const detailsField = item.details || item.description || item.desc || null;
                
                // Checks if details property doesn't exist, is null, or is an empty string
                return (detailsField === null) || (String(detailsField).trim() === "");
            });

            counter.textContent = `${incompleteItems.length} Issues Found`;

            if (incompleteItems.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: #22c55e;">
                        <h2>🎉 Clean Audit! Every item in the database has details filled out.</h2>
                    </div>`;
                return;
            }

            // 3. Render items directly
            container.innerHTML = incompleteItems.map(item => {
                return `
                    <div class="audit-card">
                        <div><span class="issue-tag">❌ No Details Configured</span></div>
                        <h3 style="margin: 5px 0; color: white;">${item.name || item.title || "Unnamed Item"}</h3>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>ID:</strong> ${item._id || item.id || 'N/A'}</p>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Category:</strong> ${item.category || 'Unassigned'}</p>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Base Price:</strong> KES ${item.price || '0'}</p>
                    </div>
                `;
            }).join('');

        } catch (error) {
            console.error("Audit error:", error);
            counter.textContent = "Error";
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #ef4444;">
                    <h3>❌ API Connection Failed</h3>
                    <p>Make sure BACKEND_API_URL matches your active server address.</p>
                </div>`;
        }
    });
</script>
</body>
</html>
