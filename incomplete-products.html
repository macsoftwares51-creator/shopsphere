<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Incomplete Items Audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent: #ef4444; 
            --success: #22c55e;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b, #030712);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header.audit-header {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        .counter-badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .counter-badge.clean {
            background: var(--success);
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .audit-card {
            background: var(--card-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.3s ease, opacity 0.3s ease, border-color 0.3s ease;
        }

        .issue-tag {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 8px;
            width: fit-content;
        }

        /* --- INLINE EDIT FORMS --- */
        .inline-fix-box {
            margin-top: 8px;
            border-top: 1px solid var(--glass-border);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .inline-fix-box label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .inline-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.2s;
        }

        .inline-input:focus {
            border-color: var(--success);
        }

        .btn-save {
            background: var(--success);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn-save:hover {
            background: #16a34a;
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-back {
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<header class="audit-header">
    <div>
        <h1 style="margin: 0 0 5px 0; font-weight: 800; letter-spacing: -1px;">Incomplete Products</h1>
        <p style="margin: 0; color: var(--text-dim); font-size: 14px;">Direct API live database audit filter.</p>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span class="counter-badge" id="issue-count">Connecting...</span>
        <a href="products.html" class="btn-back">← Storefront</a>
    </div>
</header>

<main class="grid" id="audit-container">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">📡 Connecting straight to Render API database instance...</div>
</main>

<script>
    const BACKEND_API_URL = "https://shopsphere-backend-wr5o.onrender.com/products"; 
    let issuesFoundCount = 0;

    document.addEventListener("DOMContentLoaded", fetchAndAuditProducts);

    async () => { /* Kept placeholder setup match structure */ };

    async function fetchAndAuditProducts() {
        const container = document.getElementById("audit-container");
        const counter = document.getElementById("issue-count");

        try {
            const response = await fetch(BACKEND_API_URL);
            if (!response.ok) throw new Error("Database offline or rejected request stream");
            
            const allProducts = await response.json();

            // Filter items where the details property is missing
            const incompleteItems = allProducts.filter(item => {
                const detailsField = item.details || item.description || item.desc || null;
                return (detailsField === null) || (String(detailsField).trim() === "");
            });

            issuesFoundCount = incompleteItems.length;
            updateCounterDisplay();

            if (issuesFoundCount === 0) {
                renderCleanAuditMessage(container);
                return;
            }

            // Render cards with direct inline update inputs
            container.innerHTML = incompleteItems.map(item => {
                const id = item._id || item.id || 'N/A';
                return `
                    <div class="audit-card" id="card-${id}">
                        <div><span class="issue-tag">❌ No Details Configured</span></div>
                        <h3 style="margin: 5px 0; color: white;">${item.name || item.title || "Unnamed Item"}</h3>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>ID:</strong> ${id}</p>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Category:</strong> ${item.category || 'Unassigned'}</p>
                        <p style="margin: 0; font-size: 13px; color: var(--text-dim);"><strong>Base Price:</strong> KES ${item.price || '0'}</p>
                        
                        <div class="inline-fix-box">
                            <label>Add Missing Details</label>
                            <textarea class="inline-input" id="input-${id}" placeholder="Type description or specs here..."></textarea>
                            <button class="btn-save" id="btn-${id}" onclick="saveProductDetails('${id}')">
                                Save Details
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

        } catch (error) {
            console.error("Audit error:", error);
            counter.textContent = "Error";
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #ef4444;">
                    <h3>❌ API Connection Failed</h3>
                    <p>Make sure BACKEND_API_URL matches your active server address.</p>
                </div>`;
        }
    }

    // Direct PUT Request handler to update database record live
    async function saveProductDetails(productId) {
        const inputField = document.getElementById(`input-${productId}`);
        const saveButton = document.getElementById(`btn-${productId}`);
        const targetCard = document.getElementById(`card-${productId}`);
        const textValue = inputField.value.trim();

        if (!textValue) return alert("Please type something before saving!");

        // UI feedback while updating layout state
        saveButton.disabled = true;
        saveButton.innerText = "Saving to Server...";

        try {
            const response = await fetch(`${BACKEND_API_URL}/${productId}`, {
                method: "PUT", // Switches to PATCH if your router endpoint explicitly expects it
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ details: textValue })
            });

            if (!response.ok) throw new Error("Server rejected product modifications data parameters");

            // Success animation flow: turn green, slide/fade out
            targetCard.style.borderColor = "var(--success)";
            targetCard.style.opacity = "0";
            targetCard.style.transform = "scale(0.9)";

            setTimeout(() => {
                targetCard.remove();
                issuesFoundCount--;
                updateCounterDisplay();

                // If that was the last item cleaned up
                if (issuesFoundCount === 0) {
                    renderCleanAuditMessage(document.getElementById("audit-container"));
                }
            }, 300);

        } catch (error) {
            console.error("Failed updating field data content context:", error);
            alert("Error updating item. Check your database connectivity rules.");
            saveButton.disabled = false;
            saveButton.innerText = "Save Details";
        }
    }

    function updateCounterDisplay() {
        const counter = document.getElementById("issue-count");
        if (issuesFoundCount === 0) {
            counter.textContent = "0 Issues Found";
            counter.classList.add("clean");
        } else {
            counter.textContent = `${issuesFoundCount} Issues Found`;
            counter.classList.remove("clean");
        }
    }

    function renderCleanAuditMessage(domElement) {
        domElement.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: #22c55e;">
                <h2>🎉 Clean Audit! Every item in the database has details filled out.</h2>
            </div>`;
    }
</script>
</body>
</html>
